namespace: user-mgmt
images:
  # Die beiden Tags werden von der GitHub-Actions-Pipeline automatisch gesetzt
  backend: sidardenli/user-mgmt-service:494b9a5
  moduleService: sidardenli/module-service:238728e
  # Frontend wird manuell getaggt (kein :latest -> Kyverno Policy disallow-latest-tag)
  frontend: sidardenli/auth_portal:1.0.0
replicaCount:
  backend: 1
  frontend: 1
  moduleService: 2
# Aufgabe 6: Python Microservice
moduleService:
  enabled: true
  port: 8000
  # Vertikale Skalierung: bewusst dimensioniert (1 uvicorn Worker ~ max 1 CPU)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
# Aufgabe 4: Zugangsdaten der Managed Databases kommen aus Terraform
# und liegen als Kubernetes Secret im Namespace (nicht im Git!).
database:
  secretName: user-mgmt-db
moduleServiceDatabase:
  secretName: module-service-db
secrets:
  jwtSecret: "wIDAQABAkAzGlFARFau7K0b9FcEwIDAQABAkAzGlFARFau7K0b9FcEwIDAQABAkAzGlFARFau7K0b9FcE"
config:
  springJpaHibernateDdlAuto: "update"
  springJpaShowSql: "false"
  jwtIssuer: "Spring"
  jwtExpirationMillis: "86400000"
  nextPublicApiUrl: "http://backend:8080"
  moduleServiceBaseUrl: "http://module-service:8000"
ingress:
  host: user-mgmt.168.144.6.164.nip.io
  # Aufgabe 2: vordefinierte Lastverteilungsstrategie ueber den Ingress
  loadBalanceAlgorithm: round_robin
# Aufgabe 1: ServiceMonitor fuer Prometheus
monitoring:
  enabled: true
  scrapeInterval: 15s
  namespace: monitoring
# Aufgabe 2: Namespace, aus dem k6 auf die Services zugreifen darf
loadtest:
  namespace: loadtest
hpa:
  backend:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
resources:
  backend:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  frontend:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"
quota:
  requestsCpu: "3"
  requestsMemory: 3Gi
  limitsCpu: "6"
  limitsMemory: 6Gi