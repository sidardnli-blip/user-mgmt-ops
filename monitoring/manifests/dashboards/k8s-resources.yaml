# Von Grafana automatisch geladen (Sidecar sucht nach dem Label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-resources
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-resources.json: |-
    {
      "uid": "user-mgmt-k8s",
      "title": "User-Mgmt - Kubernetes Ressourcen",
      "description": "Aufgabe 1/2: CPU und Memory pro Pod, HPA-Skalierung",
      "tags": [
        "teko",
        "user-mgmt"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "type": "query",
            "name": "namespace",
            "label": "Namespace",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "query": "label_values(kube_pod_info{namespace=~\"user-mgmt.*\"}, namespace)",
            "current": {
              "text": "user-mgmt",
              "value": "user-mgmt"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU-Auslastung pro Pod",
          "description": "CPU-Kerne pro Pod (Aufgabe 1: CPU-Auslastung pro Pod)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\", container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory-Auslastung pro Pod",
          "description": "Working Set pro Pod (Aufgabe 1: Memory-Auslastung pro Pod)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU: Verbrauch vs. Request/Limit (backend)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"backend-.*\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(kube_pod_container_resource_requests{namespace=\"$namespace\", pod=~\"backend-.*\", resource=\"cpu\"})",
              "legendFormat": "Request",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(kube_pod_container_resource_limits{namespace=\"$namespace\", pod=~\"backend-.*\", resource=\"cpu\"})",
              "legendFormat": "Limit",
              "refId": "C",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memory: Verbrauch vs. Limit (backend)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"backend-.*\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(kube_pod_container_resource_limits{namespace=\"$namespace\", pod=~\"backend-.*\", resource=\"memory\"})",
              "legendFormat": "Limit",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HPA: aktuelle vs. gewuenschte Replicas",
          "description": "Aufgabe 2: Skaliert der HPA unter Last hoch und danach wieder runter?",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"backend-hpa\"}",
              "legendFormat": "aktuell",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"backend-hpa\"}",
              "legendFormat": "gewuenscht",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"backend-hpa\"}",
              "legendFormat": "max",
              "refId": "C",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Verfuegbare Pods pro Deployment",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"$namespace\"}",
              "legendFormat": "{{deployment}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container Restarts (1h)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU Throttling",
          "description": "Wird der Container durch sein CPU-Limit ausgebremst?",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
