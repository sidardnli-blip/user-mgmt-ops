# Von Grafana automatisch geladen (Sidecar sucht nach dem Label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-user-mgmt-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  user-mgmt-service.json: |-
    {
      "uid": "user-mgmt-app",
      "title": "User-Mgmt - user_mgmt_service",
      "description": "Aufgabe 1/2/6: Request Rate, Response Time, Error Rate, Circuit Breaker",
      "tags": [
        "teko",
        "user-mgmt"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "type": "query",
            "name": "namespace",
            "label": "Namespace",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "query": "label_values(kube_pod_info{namespace=~\"user-mgmt.*\"}, namespace)",
            "current": {
              "text": "user-mgmt",
              "value": "user-mgmt"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "description": "Aufgabe 1: Request Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{uri}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Rate (% 5xx)",
          "description": "Aufgabe 1: Error Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * sum(rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"backend\", status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"backend\"}[1m])), 0.001)",
              "legendFormat": "Error Rate",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Response Time (Perzentile)",
          "description": "Aufgabe 1: Response Time",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p50",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p95",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p99",
              "refId": "C",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests pro Pod (Lastverteilung)",
          "description": "Aufgabe 2: Nachweis, dass Requests auf alle Replicas verteilt werden",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Status Codes",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"$namespace\", job=\"backend\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "k6 Lasttest: virtuelle User & Requests",
          "description": "Aufgabe 2: kommt per Remote Write direkt aus k6",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "k6_vus",
              "legendFormat": "k6 VUs",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(k6_http_reqs_total[1m]))",
              "legendFormat": "k6 req/s",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "JVM Heap",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"$namespace\", job=\"backend\", area=\"heap\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(jvm_memory_max_bytes{namespace=\"$namespace\", job=\"backend\", area=\"heap\"})",
              "legendFormat": "max",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Circuit Breaker module_service",
          "description": "Aufgabe 6: 1 = aktueller Zustand (closed / open / half_open)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "resilience4j_circuitbreaker_state{namespace=\"$namespace\", job=\"backend\", name=\"moduleService\"}",
              "legendFormat": "{{state}} ({{pod}})",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Modulzuweisungen nach Ergebnis",
          "description": "Eigene Fachmetrik des user_mgmt_service",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (result) (rate(module_assignment_requests_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{result}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Retry-Aufrufe zum module_service",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (kind) (rate(resilience4j_retry_calls_total{namespace=\"$namespace\", job=\"backend\"}[5m]))",
              "legendFormat": "{{kind}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
