# Von Grafana automatisch geladen (Sidecar sucht nach dem Label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-module-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  module-service.json: |-
    {
      "uid": "user-mgmt-module",
      "title": "User-Mgmt - module_service",
      "description": "Aufgabe 6: Request Rate, Response Time, Error Rate, Ressourcen",
      "tags": [
        "teko",
        "user-mgmt"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "type": "query",
            "name": "namespace",
            "label": "Namespace",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "query": "label_values(kube_pod_info{namespace=~\"user-mgmt.*\"}, namespace)",
            "current": {
              "text": "user-mgmt",
              "value": "user-mgmt"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "description": "Aufgabe 6: Request Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (handler) (rate(http_requests_total{namespace=\"$namespace\", job=\"module-service\"}[1m]))",
              "legendFormat": "{{handler}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Rate (% 5xx)",
          "description": "Aufgabe 6: Error Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * sum(rate(http_requests_total{namespace=\"$namespace\", job=\"module-service\", status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\", job=\"module-service\"}[1m])), 0.001)",
              "legendFormat": "Error Rate",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Response Time (Perzentile)",
          "description": "Aufgabe 6: Response Time",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", job=\"module-service\"}[1m])))",
              "legendFormat": "p50",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", job=\"module-service\"}[1m])))",
              "legendFormat": "p95",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", job=\"module-service\"}[1m])))",
              "legendFormat": "p99",
              "refId": "C",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Status Codes",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\", job=\"module-service\"}[1m]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU: Verbrauch vs. Limit (vertikale Skalierung)",
          "description": "Aufgabe 6: sind die CPU-Limits richtig dimensioniert?",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"module-service-.*\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(kube_pod_container_resource_limits{namespace=\"$namespace\", pod=~\"module-service-.*\", resource=\"cpu\"})",
              "legendFormat": "Limit",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory: Verbrauch vs. Limit (vertikale Skalierung)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"module-service-.*\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(kube_pod_container_resource_limits{namespace=\"$namespace\", pod=~\"module-service-.*\", resource=\"memory\"})",
              "legendFormat": "Limit",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Throttling (Limit zu klein?)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\", pod=~\"module-service-.*\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Laufende Requests & verfuegbare Pods",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (http_requests_in_progress{namespace=\"$namespace\", job=\"module-service\"})",
              "legendFormat": "in progress {{pod}}",
              "refId": "A",
              "range": true,
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=\"module-service\"}",
              "legendFormat": "verfuegbare Pods",
              "refId": "B",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
