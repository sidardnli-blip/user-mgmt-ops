apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-module-db-secret
  annotations:
    policies.kyverno.io/title: MySQL Secret nur fuer den module_service
    policies.kyverno.io/category: Sicherheit
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Aufgabe 6 verlangt, dass der user_mgmt_service KEINEN direkten Zugriff auf die
      Managed MySQL Datenbank hat. Diese Policy setzt das technisch durch: nur Pods
      mit dem Label app=module-service duerfen das Secret module-service-db verwenden.
spec:
  background: true
  rules:
    - name: only-module-service-may-use-mysql-secret
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - user-mgmt
                - user-mgmt-*
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.app || '' }}"
            operator: NotEquals
            value: module-service
      validate:
        failureAction: Enforce
        message: >-
          Nur der module_service darf das Secret module-service-db verwenden.
          Der user_mgmt_service greift ausschliesslich ueber die REST-API zu.
        deny:
          conditions:
            any:
              - key: module-service-db
                operator: AnyIn
                value: "{{ request.object.spec.containers[].envFrom[].secretRef.name || `[]` }}"
              - key: module-service-db
                operator: AnyIn
                value: "{{ request.object.spec.containers[].env[].valueFrom.secretKeyRef.name || `[]` }}"
              - key: module-service-db
                operator: AnyIn
                value: "{{ request.object.spec.volumes[].secret.secretName || `[]` }}"
