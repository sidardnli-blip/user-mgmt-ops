# Aufgabe 5 + 6: Nachweis, dass der user_mgmt_service NICHT an die MySQL
# Zugangsdaten des module_service kommt. Dieses Deployment versucht genau das.
#
# Anwenden mit:  kubectl apply -f kyverno/tests/invalid-secret-access.yaml
# Erwartung: Ablehnung durch die Policy restrict-module-db-secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-test-mysql-access
  namespace: user-mgmt
  labels:
    app: backend-kopie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-kopie
  template:
    metadata:
      labels:
        app: backend-kopie
    spec:
      containers:
        - name: backend
          image: sidardenli/user-mgmt-service:5b725f5
          envFrom:
            - secretRef:
                name: module-service-db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
