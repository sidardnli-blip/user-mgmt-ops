{{- if .Values.moduleService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-service
  namespace: {{ .Values.namespace }}
  labels:
    app: module-service
spec:
  replicas: {{ .Values.replicaCount.moduleService }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: module-service
  template:
    metadata:
      labels:
        app: module-service
    spec:
      containers:
        - name: module-service
          image: {{ .Values.images.moduleService }}
          ports:
            - name: http
              containerPort: {{ .Values.moduleService.port }}
          envFrom:
            # DATABASE_URL der DigitalOcean Managed MySQL (von Terraform erzeugt).
            # NUR dieser Service bekommt das Secret -> user_mgmt_service hat keinen
            # direkten Zugriff auf MySQL.
            - secretRef:
                name: {{ .Values.moduleServiceDatabase.secretName }}
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_INIT_ON_STARTUP
              value: "true"
            - name: METRICS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: {{ .Values.moduleService.resources.requests.cpu | quote }}
              memory: {{ .Values.moduleService.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.moduleService.resources.limits.cpu | quote }}
              memory: {{ .Values.moduleService.resources.limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: module-service
  namespace: {{ .Values.namespace }}
  labels:
    app: module-service
spec:
  selector:
    app: module-service
  ports:
    - name: http
      port: {{ .Values.moduleService.port }}
      targetPort: http
{{- end }}
