apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sidardnli-blip/user-mgmt-ops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: user-mgmt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true