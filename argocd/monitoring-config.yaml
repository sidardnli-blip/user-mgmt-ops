# ArgoCD verwaltet unsere eigenen Monitoring-Objekte:
#   - PrometheusRule (Alerts)
#   - Grafana Dashboards (als ConfigMaps)
# Der kube-prometheus-stack selbst wird per Helm installiert (siehe docs/01).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sidardnli-blip/user-mgmt-ops.git
    targetRevision: main
    path: monitoring/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
